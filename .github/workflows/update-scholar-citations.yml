name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install updater dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh citation data
        run: python scripts/update_scholar_citations.py
      - name: Commit changed citation data
        run: |
          if git diff --quiet -- data/scholar-citations.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar-citations.json
          git commit -m "Update Google Scholar citation counts"
          git push
